apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/donato-marcos/k8s-configs.git
    targetRevision: main
    path: clusters/homelab/apps
    directory:
      recurse: true
      exclude: "root-apps.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true