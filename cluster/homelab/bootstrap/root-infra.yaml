apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-infra
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/donato-marcos/k8s-configs.git
    targetRevision: main
    path: cluster/homelab/infra
    directory:
      recurse: true
      exclude: "root-infra.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true