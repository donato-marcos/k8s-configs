# cilium-values.yaml
autoDirectNodeRoutes: true
bgpControlPlane:
  enabled: true
bpf:
  hostLegacyRouting: false
  masquerade: true
  tproxy: true
cluster:
  id: 1
  name: k8s-cluster
enableIPv4BIGTCP: true
enableIPv4Masquerade: true
enableIPv6BIGTCP: true
enableIPv6Masquerade: true
envoy:
  enabled: true
  securityContext:
    capabilities:
      envoy:
      - NET_ADMIN
      - SYS_ADMIN
      keepCapNetBindService: true
extraConfig:
  enable-ipv6-ndp: "true"
  ipv6-mcast-device: enp2s0
gatewayAPI:
  enabled: true
hubble:
  enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - port-distribution
    - icmp
    - http
  peerService:
    clusterDomain: cluster.local
  relay:
    enabled: true
  tls:
    enabled: false
  ui:
    enabled: true
ipam:
  mode: kubernetes
  operator:
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv4PodCIDRList:
    - 10.244.0.0/16
    clusterPoolIPv6MaskSize: 64
    clusterPoolIPv6PodCIDRList:
    - fd00:10:244::/56
ipv4:
  enabled: true
ipv4NativeRoutingCIDR: 10.244.0.0/16
ipv6:
  enabled: true
ipv6NativeRoutingCIDR: fd00:10:244::/56
k8sServiceHost: 172.16.1.11
k8sServicePort: 6443
kubeProxyReplacement: true
loadBalancer:
  acceleration: best-effort
  algorithm: maglev
  dsrDispatch: opt
  l7:
    backend: envoy
    ports: []
  mode: dsr
  serviceTopology: true
  standalone: false
operator:
  prometheus:
    enabled: true
prometheus:
  enabled: false
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - NET_BIND_SERVICE
    - IPC_LOCK
    - SYS_MODULE
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    - SYSLOG
    cleanCiliumState:
    - NET_ADMIN
    - SYS_MODULE
    - SYS_ADMIN
    - SYS_RESOURCE