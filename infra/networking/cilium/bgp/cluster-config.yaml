apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-dualstack-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
  - name: "instance-dualstack"
    localASN: 64513
    localPort: 179
    peers:
    - name: "vyos-router-v4"
      peerASN: 64512
      peerAddress: "172.16.200.254"
      peerConfigRef:
        name: "peer-config-ipv4"
    - name: "vyos-router-v6"
      peerASN: 64512
      peerAddress: "fd00:172:16:200::254"
      peerConfigRef:
        name: "peer-config-ipv6"