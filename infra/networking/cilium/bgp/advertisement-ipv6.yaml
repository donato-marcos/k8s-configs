apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-ipv6-adv
  labels:
    family: ipv6
spec:
  advertisements:
  - advertisementType: "Service"
    service:
      addresses:
      - LoadBalancerIP
    selector:
      matchExpressions:
      - key: io.kubernetes.service.name
        operator: In
        values:
        - cilium-gateway-meu-gateway-dualstack