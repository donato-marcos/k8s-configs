apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-ipv4-adv
  labels:
    family: ipv4
spec:
  advertisements:
  - advertisementType: "Service"
    service:
      addresses:
      - LoadBalancerIP
    selector:
      matchExpressions:
      - key: io.kubernetes.service.name
        operator: NotIn
        values:
        - dummy-service-value