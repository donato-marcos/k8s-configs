# longhorn-values.yaml
global:
  timezone: "America/Sao_Paulo"
service:
  ui:
    type: ClusterIP
persistence:
  defaultClassReplicaCount: 3
  defaultFsType: ext4
  reclaimPolicy: Delete
defaultSettings:
  defaultDataPath: "/var/lib/longhorn"
  #v1DataEngine: true
  #v2DataEngine: false
preUpgradeChecker:
  jobEnabled: false