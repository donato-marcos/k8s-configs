# longhorn-values.yaml
global:
  timezone: "America/Sao_Paulo"
service:
  ui:
    type: ClusterIP
persistence:
  defaultClassReplicaCount: 3
  defaultFsType: xfs
  reclaimPolicy: Delete
defaultSettings:
  defaultDataPath: "/var/mnt/longhorn"
  #v1DataEngine: true
  #v2DataEngine: false
  storageMinimalAvailablePercentage: 15
  storageOverProvisioningPercentage: 100
preUpgradeChecker:
  jobEnabled: false