apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aesthar-com-br-staging-tls
  namespace: default
spec:
  dnsNames:
  - '*.aesthar.com.br'
  - 'aesthar.com.br'
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging
  secretName: aesthar-com-br-staging-tls